services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.18.2}
    container_name: test-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms4g -Xmx4g}
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  esrs-server:
    build:
      context: https://github.com/elastic/relevance-studio.git#main
      dockerfile: Dockerfile-server
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      MCP_SERVER_URL: http://esrs-server-mcp:4200/mcp
      ELASTICSEARCH_URL: ${ESRS_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      CONTENT_ELASTICSEARCH_URL: ${CONTENT_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      TLS_ENABLED: "false"
      AUTH_ENABLED: "false"
    volumes:
      - ./docker/esrs-server-flask.py:/app/server/flask.py:ro
      - ./docker/esrs-index-templates:/app/server/elastic/index_templates:ro
    ports:
      - "4096:4096"
    restart: unless-stopped

  esrs-worker:
    build:
      context: https://github.com/elastic/relevance-studio.git#main
      dockerfile: Dockerfile-worker
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: ${ESRS_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      CONTENT_ELASTICSEARCH_URL: ${CONTENT_ELASTICSEARCH_URL:-http://elasticsearch:9200}
    restart: unless-stopped

  esrs-server-mcp:
    build:
      context: https://github.com/elastic/relevance-studio.git#main
      dockerfile: Dockerfile-server-mcp
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: ${ESRS_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      CONTENT_ELASTICSEARCH_URL: ${CONTENT_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      TLS_ENABLED: "false"
    ports:
      - "4200:4200"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION:-8.18.2}
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-4fb2ab8c63ad32bc2c7d5ea61f0ef18d}
    ports:
      - "5601:5601"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: test-mysql
    command: --loose-mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jawiki}
      MYSQL_USER: ${MYSQL_USER:-wikiuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wikipassword}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  es-data:
  mysql-data:
