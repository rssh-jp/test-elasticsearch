services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.18.2}
    container_name: test-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  es-setup:
    image: curlimages/curl:8.12.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-kibana_system_password}
    command:
      - sh
      - -c
      - |
        set -eu
        curl -fsS -u elastic:$${ELASTIC_PASSWORD} \
          -H 'Content-Type: application/json' \
          -X POST \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -d '{"password":"'"$${KIBANA_SYSTEM_PASSWORD}"'"}'

  esrs-server:
    build:
      context: https://github.com/elastic/relevance-studio.git#main
      dockerfile: Dockerfile-server
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      MCP_SERVER_URL: http://esrs-server-mcp:4200/mcp
      ELASTICSEARCH_URL: ${ESRS_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ESRS_ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ESRS_ELASTICSEARCH_PASSWORD:-changeme}
      CONTENT_ELASTICSEARCH_URL: ${CONTENT_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      CONTENT_ELASTICSEARCH_USERNAME: ${CONTENT_ELASTICSEARCH_USERNAME:-elastic}
      CONTENT_ELASTICSEARCH_PASSWORD: ${CONTENT_ELASTICSEARCH_PASSWORD:-changeme}
    ports:
      - "4096:4096"
    restart: unless-stopped

  esrs-worker:
    build:
      context: https://github.com/elastic/relevance-studio.git#main
      dockerfile: Dockerfile-worker
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: ${ESRS_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ESRS_ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ESRS_ELASTICSEARCH_PASSWORD:-changeme}
      CONTENT_ELASTICSEARCH_URL: ${CONTENT_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      CONTENT_ELASTICSEARCH_USERNAME: ${CONTENT_ELASTICSEARCH_USERNAME:-elastic}
      CONTENT_ELASTICSEARCH_PASSWORD: ${CONTENT_ELASTICSEARCH_PASSWORD:-changeme}
    restart: unless-stopped

  esrs-server-mcp:
    build:
      context: https://github.com/elastic/relevance-studio.git#main
      dockerfile: Dockerfile-server-mcp
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: ${ESRS_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ESRS_ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ESRS_ELASTICSEARCH_PASSWORD:-changeme}
      CONTENT_ELASTICSEARCH_URL: ${CONTENT_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      CONTENT_ELASTICSEARCH_USERNAME: ${CONTENT_ELASTICSEARCH_USERNAME:-elastic}
      CONTENT_ELASTICSEARCH_PASSWORD: ${CONTENT_ELASTICSEARCH_PASSWORD:-changeme}
    ports:
      - "4200:4200"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION:-8.18.2}
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${KIBANA_ELASTICSEARCH_USERNAME:-kibana_system}
      ELASTICSEARCH_PASSWORD: ${KIBANA_ELASTICSEARCH_PASSWORD:-kibana_system_password}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-4fb2ab8c63ad32bc2c7d5ea61f0ef18d}
    ports:
      - "5601:5601"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: test-mysql
    command: --loose-mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jawiki}
      MYSQL_USER: ${MYSQL_USER:-wikiuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wikipassword}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  wiki-to-mysql:
    build:
      context: .
      dockerfile: Dockerfile.wiki-loader
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./data:/data
    environment:
      WIKI_DUMP_PATH: ${WIKI_DUMP_PATH:-/data/dumps/jawiki-latest-pages-articles-multistream.xml.bz2}
      WIKI_MAX_DOC_CHARS: ${WIKI_MAX_DOC_CHARS:-5000}
      MYSQL_BULK_SIZE: ${MYSQL_BULK_SIZE:-500}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-wikiuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wikipassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jawiki}
    command: ["python", "scripts/dump_to_mysql.py"]

  mysql-to-es:
    build:
      context: .
      dockerfile: Dockerfile.wiki-loader
    profiles: ["tools"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      mysql:
        condition: service_healthy
    working_dir: /app
    environment:
      ES_URL: http://elasticsearch:9200
      ES_USER: ${LOADER_ES_USER:-elastic}
      ES_PASSWORD: ${LOADER_ES_PASSWORD:-changeme}
      WIKI_ALIAS_NAME: ${WIKI_ALIAS_NAME:-jawiki_current}
      ES_BULK_SIZE: ${ES_BULK_SIZE:-200}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-wikiuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wikipassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jawiki}
    command: ["python", "scripts/mysql_to_es.py"]

volumes:
  es-data:
  mysql-data:
